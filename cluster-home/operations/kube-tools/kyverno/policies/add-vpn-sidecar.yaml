---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-vpn-sidecar
  annotations:
    policies.kyverno.io/title: Add VPN client sidecar
spec:
  generateExisting: true
  rules:
    - name: add-vpn-sidecar
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  (vpn/gluetun-inject): "true"
              spec:
                containers:
                  - name: gluetun
                    image: ghcr.io/qdm12/gluetun@sha256:7460b04ec1b17f2c379bba80733deffa8e4b8e223693c16f9367e46fd41ee9fe
                    env:
                      - name: DNS_ADDRESS
                        value: "${CLUSTER_DNS}"
                      - name: FIREWALL_INPUT_PORTS
                        value: "6767,8191,8096,5055,8686,7373,9696,6881,7878,7373,8989,8265,8266,8080"
                      - name: FIREWALL_OUTBOUND_SUBNETS
                        value: "${NETWORK_CIDR_K8S_CLUSTER},${NETWORK_CIDR_K8S_SERVICE},${NETWORK_CIDR_K8S_SERVICE_EXTERNAL},${NETWORK_CIDR_HOST}"
                      - name: VPN_SERVICE_PROVIDER
                        value: ${SECRET_VPN_GATEWAY_PROVIDER}
                      - name: VPN_TYPE
                        value: openvpn
                      - name: OPENVPN_USER
                        value: ${SECRET_VPN_GATEWAY_USER}
                      - name: OPENVPN_PASSWORD
                        value: ${SECRET_VPN_GATEWAY_PASSWORD}
                      - name: VPN_PORT_FORWARDING_LISTENING_PORT
                        value: "'${SECRET_VPN_BT_FORWARD_PORT}'"
                      - name: TZ
                        value: ${TIMEZONE}
                    # OpenVPN keeps retrying the same server after AUTH_FAILED
                    # and gluetun's own health restart never fires; after hours
                    # of that the sidecar spins at ~3.5 cores (pegged the Proxmox
                    # host 2026-07-13..08-26). Let kubelet restart it once the
                    # tunnel has been down ~5 min so gluetun picks another server.
                    livenessProbe:
                      exec:
                        command: ["/gluetun-entrypoint", "healthcheck"]
                      initialDelaySeconds: 120
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 10
                    securityContext:
                      privileged: true
                      runAsUser: 0
                      capabilities:
                        add:
                          - NET_ADMIN
                    volumeMounts:
                      - name: tun
                        mountPath: /dev/net
                volumes:
                  - name: tun
                    hostPath:
                      path: /dev/net
